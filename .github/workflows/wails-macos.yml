name: Wails macOS application

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/wails3-ui
    paths:
      - ".github/workflows/wails-macos.yml"
      - "cmd/api-automation/**"
      - "internal/application/**"
      - "internal/appwails/**"
      - "internal/capabilities/**"
      - "internal/fiery/**"
      - "internal/files/**"
      - "internal/joboutcome/**"
      - "internal/pagevalues/**"
      - "internal/preflight/**"
      - "internal/presets/**"
      - "internal/rangevalues/**"
      - "internal/reportxlsx/**"
      - "build/wails-macos/**"
      - "tools/build-wails-macos.sh"
      - "tools/package-wails-macos.sh"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  native-build:
    name: ${{ matrix.arch }} native build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cmd/api-automation/frontend/package-lock.json

      - name: Verify pinned Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
          test "$(wails3 version 2>&1)" = "v3.0.0-beta.16"

      - name: Verify backend on macOS
        shell: bash
        run: |
          packages=$(go list ./internal/... | tr '\n' ' ')
          go test $packages
          go test -race ./internal/application ./internal/appwails
          go vet $packages
          go mod verify
          test -z "$(go mod tidy -diff)"

      - name: Verify and build frontend
        working-directory: cmd/api-automation/frontend
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm audit --package-lock-only
          node --check src/app.js
          node --check build.mjs
          if find src bundle -type f -name '*.map' | grep -q .; then
            echo "Source maps are not allowed in application assets" >&2
            exit 1
          fi
          npm run build

      - name: Verify generated bindings
        shell: bash
        run: |
          wails3 generate bindings -b -names -d cmd/api-automation/frontend/src/bindings ./cmd/api-automation
          git diff --exit-code -- cmd/api-automation/frontend/src/bindings

      - name: Build unsigned native application
        shell: bash
        run: |
          mkdir -p dist
          go build -tags production -trimpath -ldflags '-s -w' -o "dist/api-automation-${{ matrix.arch }}" ./cmd/api-automation
          file "dist/api-automation-${{ matrix.arch }}"
          shasum -a 256 "dist/api-automation-${{ matrix.arch }}" > "dist/api-automation-${{ matrix.arch }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: api-automation-macos-${{ matrix.arch }}-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 14

  universal-package:
    name: universal unsigned package
    needs: native-build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: api-automation-macos-*-unsigned
          path: dist
          merge-multiple: true

      - name: Build universal application bundle
        shell: bash
        run: |
          bash tools/package-wails-macos.sh 0.1.0 "$GITHUB_RUN_NUMBER"
          plutil -lint "dist/API Automation.app/Contents/Info.plist"
          test "$(lipo -archs 'dist/API Automation.app/Contents/MacOS/api-automation')" = "x86_64 arm64" || \
            test "$(lipo -archs 'dist/API Automation.app/Contents/MacOS/api-automation')" = "arm64 x86_64"

      - uses: actions/upload-artifact@v7
        with:
          name: api-automation-macos-universal-unsigned
          path: |
            dist/api-automation-macos-universal.zip
            dist/api-automation-macos-universal.zip.sha256
          if-no-files-found: error
          retention-days: 14
